<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="store" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <g transform="translate(48 60)">
    <!-- Toldo -->
    <path d="M0 12 L96 12 L88 0 L8 0 Z" fill="url(#store)"/>
    <!-- Edificio -->
    <rect x="4" y="14" width="88" height="64" rx="4" fill="#1e293b" stroke="url(#store)" stroke-width="2"/>
    <!-- Puerta -->
    <rect x="38" y="40" width="20" height="38" rx="2" fill="url(#store)"/>
    <!-- Ventanas -->
    <rect x="12" y="22" width="20" height="14" rx="2" fill="#8b5cf6" opacity="0.6"/>
    <rect x="64" y="22" width="20" height="14" rx="2" fill="#8b5cf6" opacity="0.6"/>
    <!-- Letras T (Tecnomania) -->
    <text x="48" y="60" font-family="system-ui" font-weight="900" font-size="18" fill="#fff" text-anchor="middle">T!</text>
  </g>
</svg>
